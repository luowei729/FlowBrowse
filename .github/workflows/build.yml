name: build-binaries

# 触发：推送 v* tag 或手动。交叉编译 linux amd64/arm64 单一 Go 服务端并发布到 Release，
# 供服务器 install.sh 直接下载（服务器不本地编译）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 只保留最新 run，自动取消旧的，避免排队占用 runner 卡住
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build flowbrowse-server (linux/${{ matrix.goarch }})
        working-directory: server/flowbrowse
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -o ${{ github.workspace }}/flowbrowse-server-linux-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowbrowse-server-linux-${{ matrix.goarch }}
          path: flowbrowse-server-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: mkdir -p out && find dist -type f -name 'flowbrowse-server-linux-*' -exec cp {} out/ \; && ls -l out
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/flowbrowse-server-linux-amd64
            out/flowbrowse-server-linux-arm64
          generate_release_notes: true
