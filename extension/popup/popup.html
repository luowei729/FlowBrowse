<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>FlowBrowse</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Zero Omega 风格：顶部品牌+齿轮，主体为“情景模式”一键切换列表 -->
  <header>
    <div class="brand"><span class="logo">⇄</span> FlowBrowse</div>
    <button id="btnOptions" class="gear" title="打开设置">⚙</button>
  </header>

  <div class="cur">当前情景模式：<b id="curName">直接连接</b></div>

  <ul id="profileList" class="profiles"></ul>

  <footer>
    <span id="statusText" class="muted">未连接</span>
    <button id="btnProbe" class="link" title="测速当前节点">测速</button>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
