<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowBrowse 设置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <header>
    <div class="logo">⇄</div>
    <h1>FlowBrowse 设置</h1>
  </header>

  <main>
    <!-- ===== 订阅管理 ===== -->
    <section class="card">
      <h2>订阅管理 <span class="muted">（多个订阅：配置 / 更新 / 删除）</span></h2>
      <form id="subForm">
        <div class="cols">
          <input id="subName" type="text" placeholder="订阅名称（可选）" />
          <input id="subUrl" type="text" placeholder="粘贴订阅地址（如 https://域名/令牌/随机名）" required />
        </div>
        <div class="actions" style="margin-top:12px">
          <button type="submit" class="primary">添加 / 更新订阅</button>
          <button type="button" id="refreshAll" class="">刷新全部订阅</button>
        </div>
      </form>
      <ul id="subList" class="list"></ul>
    </section>

    <!-- ===== 节点管理 ===== -->
    <section class="card">
      <h2>节点管理 <span class="muted">（多个节点：添加 / 编辑 / 删除 / 手动选择）</span></h2>
      <form id="nodeForm">
        <input type="hidden" id="nodeId" />
        <div class="cols">
          <label>名称<input id="nName" type="text" placeholder="我的节点" /></label>
          <label>地区<input id="nRegion" type="text" placeholder="SG" /></label>
          <label>代理域名/IP<input id="nHost" type="text" placeholder="sel2.lkz.pub" required /></label>
          <label>代理 TCP 端口<input id="nTcp" type="number" min="1" max="65535" placeholder="443" /></label>
          <label>用户名<input id="nUser" type="text" placeholder="可选 BasicAuth 用户" /></label>
          <label>密码<input id="nPass" type="text" placeholder="可选 BasicAuth 密码" /></label>
        </div>
        <div class="actions" style="margin-top:12px">
          <button type="submit" class="primary" id="nodeSubmit">添加节点</button>
          <button type="button" id="nodeCancel" hidden>取消编辑</button>
        </div>
      </form>
      <ul id="nodeList" class="list"></ul>
    </section>

    <!-- ===== 分流规则 ===== -->
    <section class="card">
      <h2>分流规则 <span class="muted">（默认用内置完整列表；可远程更新）</span></h2>
      <label class="check"><input id="rulesRemoteEnabled" type="checkbox" /> 启用远程规则更新</label>
      <label>CN 域名列表 URL<input id="rulesUrlDomains" type="text" placeholder="留空=用内置；可填 jsDelivr 上的 Clash/纯文本域名列表" /></label>
      <label>CN IP CIDR 列表 URL<input id="rulesUrlCidrs" type="text" placeholder="https://cdn.jsdelivr.net/gh/gaoyifan/china-operator-ip@ip-lists/china.txt" /></label>
      <p class="muted">内置已含全量 CN IP 段。远程源建议国内可直连的 jsDelivr（IP：<code>gaoyifan/china-operator-ip</code> china.txt）。解析兼容纯文本/YAML/DOMAIN-SUFFIX。</p>
    </section>

    <!-- ===== 通用设置 ===== -->
    <section class="card">
      <h2>通用设置</h2>
      <label class="check"><input id="autoConnect" type="checkbox" /> 浏览器启动时自动连接上次节点</label>
      <label>探测间隔（分钟）<input id="probeInterval" type="number" min="1" max="1440" placeholder="10" /></label>
    </section>

    <div class="card" style="flex-direction:row;align-items:center;justify-content:space-between">
      <button id="saveSettings" class="primary">保存规则与设置</button>
      <span id="msg" class="muted"></span>
    </div>
  </main>

  <script src="options.js" type="module"></script>
</body>
</html>
